extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: ["@key", "@shareable", "@inaccessible", "@override"]
  )

type Query {
  user(id: ID!): User
  "Currently logged-in user"
  me: User!
}

type Mutation {
  "Updates the logged-in user's profile information"
  updateProfile(updateProfileInput: UpdateProfileInput): UpdateProfileResponse!
   
}

"Represents an Airlock user's common properties"
interface User {
  id: ID!
  "The user's first and last name"
  name: String!
  "The user's profile photo URL"
  profilePicture: String!
}

"A host is a type of Airlock user. They own listings."
type Host implements User @key(fields: "id") {
  id: ID! # the key field, a unique identifier for a particular instance of a Host
  "The user's first and last name"
  name: String! # accounts subgraph extends this field
  "The user's profile photo URL"
  profilePicture: String! # accounts subgraph extends this field
  "The host's profile bio description, will be shown in the listing"
  profileDescription: String! # accounts subgraph extends this field
  "The overall calculated rating for the host"
  overallRating: Float @shareable # reviews subgraph extends this field - Eventually
  "Where the host is primarily located"
  coordinates: GalacticCoordinates @shareable
}

"A guest is a type of Airlock user. They book places to stay."
type Guest implements User @key(fields: "id") {
  id: ID! # the key field, a unique identifier for a particular instance of a Guest
  "The user's first and last name"
  name: String! # accounts subgraph
  "The user's profile photo URL"
  profilePicture: String! # accounts subgraph
  "Amount of money in the guest's wallet"
  funds: Float! @override(from: "payments") # payments subgraph will extend this field
}

interface MutationResponse {
  "Similar to HTTP status code, represents the status of the mutation"
  code: Int!
  "Indicates whether the mutation was successful"
  success: Boolean!
  "Human-readable message for the UI"
  message: String!
}

"Fields that can be updated"
input UpdateProfileInput {
  "The user's first and last name"
  name: String
  "The user's profile photo URL"
  profilePicture: String
  "The host's profile bio description, will be shown in the listing"
  profileDescription: String
}

"The response after updating a profile"
type UpdateProfileResponse implements MutationResponse {
  "Similar to HTTP status code, represents the status of the mutation"
  code: Int!
  "Indicates whether the mutation was successful"
  success: Boolean!
  "Human-readable message for the UI"
  message: String!
  "Updated user"
  user: User
}


type GalacticCoordinates @shareable {
  # The y-axis value of this coordinate
  latitude: Float!
  # The x-axis value of this coordinate
  longitude: Float!
  # A nickname for this coordinate
  nickname: String 
}