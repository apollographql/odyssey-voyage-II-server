extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: ["@key", "@shareable", "@inaccessible"]
  )

"The root query type"
type Query {
  "Get a guest by ID"
  guest(id: ID!): Guest
}

"The root mutation type"
type Mutation {
  "Add funds to a guest's wallet"
  addFundsToWallet(amount: Float!): AddFundsToWalletResponse
}

type AddFundsToWalletResponse implements MutationResponse {
  "Similar to HTTP status code, represents the status of the mutation"
  code: Int!
  "Indicates whether the mutation was successful"
  success: Boolean!
  "Human-readable message for the UI"
  message: String!
  "Updated wallet amount"
  amount: Float
}

"A standard mutation response interface"
interface MutationResponse {
  "Similar to HTTP status code, represents the status of the mutation"
  code: Int! 
  "Indicates whether the mutation was successful"
  success: Boolean! 
  "Human-readable message for the UI"
  message: String! 
}

"A guest is a type of Airlock user. They book places to stay."
type Guest @key(fields: "id") {
  "The unique identifier of the guest"
  id: ID! # the key field, a unique identifier for a particular instance of a Guest
  "Amount of money in the guest's wallet"
  funds: Float!
}